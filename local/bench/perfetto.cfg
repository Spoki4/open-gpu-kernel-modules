# Perfetto trace config for local/bench/bench.py (tracebox --txt -c).
# System-wide ftrace: the scheduler with the kernel function a thread blocked
# in (sched_blocked_reason, symbolized), page flips, the patched driver's
# events (nvidia_vidmem:*, kernel-open/nvidia/nv-vidmem-trace.h), Xids, and
# trace_marker writes (bench.py's counters "C|pid|name|value" and phase marks).
buffers {
  size_kb: 262144
  fill_policy: DISCARD
}
buffers {
  size_kb: 8192
  fill_policy: DISCARD
}
data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_wakeup_new"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "sched/sched_process_free"
      ftrace_events: "sched/sched_blocked_reason"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "drm/drm_vblank_event"
      ftrace_events: "drm/drm_vblank_event_delivered"
      ftrace_events: "dma_fence/dma_fence_signaled"
      ftrace_events: "nvidia/nvidia_dev_xid"
      ftrace_events: "nvidia_vidmem/*"
      ftrace_events: "ftrace/print"
      compact_sched { enabled: true }
      symbolize_ksyms: true
      buffer_size_kb: 16384
      drain_period_ms: 250
    }
  }
}
data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 1
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 1000
    }
  }
}
data_sources {
  config {
    name: "linux.sys_stats"
    target_buffer: 1
    sys_stats_config {
      meminfo_period_ms: 1000
      meminfo_counters: MEMINFO_MEM_AVAILABLE
      meminfo_counters: MEMINFO_SWAP_FREE
      vmstat_period_ms: 1000
      vmstat_counters: VMSTAT_PGMAJFAULT
    }
  }
}
