<!doctype html>
<!--
nvt-webgl: a deterministic WebGL2 scene for nvtest.sh chrome. It uploads
TEX textures (1024x1024 RGBA with mipmaps, procedural, seeded), draws them
the same way every frame and hashes a readPixels() of the result every
CHECK frames. The first hash is the reference: any later difference means
GPU memory (textures, buffers, shader code) came back wrong after moving.
State goes to document.title, read over the DevTools port:
  NVT frames=<n> checks=<n> bad=<n> lost=<0|1> hash=<hex> ref=<hex>
URL parameters: tex=<count> (default 48, ~250 MB with mipmaps),
mode=anim (draw every animation frame, default), idle (draw and check
only every 5 s, like a page in a background window) or game: like a game
streaming its textures, two more per frame until mb=<MB> are uploaded (or
WebGL runs out of memory), drawing the newest 64; checks start once loading
is done. In game mode the title also has loaded=<MB> done=<0|1> fps=<1 s>.
-->
<html><head><meta charset="utf-8"><title>NVT starting</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script>
const P = new URLSearchParams(location.search);
const MODE = P.get('mode') || 'anim', CHECK = 30, N = 1024, TEX_MB = 5.34;
const GAME_TEX = Math.floor(+(P.get('mb') || 4096) / TEX_MB);
const TEX = MODE === 'game' ? 0 : +(P.get('tex') || 48);
let loadedTex = 0, done = MODE !== 'game', oom = 0, fps = 0, fpsFrames = 0, fpsT = performance.now();
const gl = document.getElementById('c').getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
let frames = 0, checks = 0, bad = 0, lost = 0, hash = 0, ref = null;

function status() {
    document.title = `NVT frames=${frames} checks=${checks} bad=${bad} lost=${lost} ` +
        `hash=${hash.toString(16)} ref=${ref === null ? '-' : ref.toString(16)}` +
        (MODE === 'game' ? ` loaded=${Math.round(loadedTex * TEX_MB)} done=${done ? 1 : 0} oom=${oom} fps=${fps}` : '');
}
if (!gl) { document.title = 'NVT nowebgl'; throw new Error('no webgl2'); }
gl.canvas.addEventListener('webglcontextlost', e => { lost = 1; status(); e.preventDefault(); });

function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 pos; uniform vec4 rect; out vec2 uv;
void main() { uv = pos; gl_Position = vec4(rect.xy + pos * rect.zw, 0.0, 1.0); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float; in vec2 uv; uniform sampler2D t; uniform float k; out vec4 o;
void main() {
    vec4 a = texture(t, uv), b = textureLod(t, uv * 0.5 + 0.25, 2.0);
    o = vec4(fract(a.rgb * k + b.bgr), 1.0);
}`));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const vb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uRect = gl.getUniformLocation(prog, 'rect'), uK = gl.getUniformLocation(prog, 'k');

// Procedural textures from a seeded xorshift, so every run is identical.
let seed = 0x12345678;
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed >>> 0; }
const texs = [], px = new Uint8Array(N * N * 4);
function makeTex(i) {
    const s = rnd();
    for (let y = 0; y < N; y++)
        for (let x = 0; x < N; x++) {
            const o = (y * N + x) * 4, v = (x * (s & 31) + y * ((s >>> 5) & 31) + ((x ^ y) & (s >>> 10))) & 255;
            px[o] = v; px[o + 1] = (v * 7 + i) & 255; px[o + 2] = (x + y + s) & 255; px[o + 3] = 255;
        }
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    texs.push(t);
}
for (let i = 0; i < TEX; i++) makeTex(i);

function draw() {
    const first = MODE === 'game' ? Math.max(0, texs.length - 64) : 0, n = texs.length - first;
    const g = Math.ceil(Math.sqrt(Math.max(n, 1))), w = 2 / g;
    gl.viewport(0, 0, N, N);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    for (let j = 0; j < n; j++) {
        const i = first + j;
        gl.bindTexture(gl.TEXTURE_2D, texs[i]);
        gl.uniform4f(uRect, -1 + (j % g) * w, -1 + Math.floor(j / g) * w, w, w);
        gl.uniform1f(uK, 1.0 + i * 0.37);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    frames++;
    fpsFrames++;
    const now = performance.now();
    if (now - fpsT >= 1000) { fps = Math.round(fpsFrames * 1000 / (now - fpsT)); fpsFrames = 0; fpsT = now; status(); }
}

// Game mode: stream two textures per frame until the target or out of memory
// (delay=<s>: start streaming only after that many seconds).
const STREAM_AT = performance.now() + 1000 * +(P.get('delay') || 0);
function stream() {
    if (done || performance.now() < STREAM_AT) return;
    for (let k = 0; k < 2 && loadedTex < GAME_TEX; k++) {
        makeTex(loadedTex);
        if (gl.getError() === gl.OUT_OF_MEMORY) { oom = 1; done = true; break; }
        loadedTex++;
    }
    if (loadedTex >= GAME_TEX) done = true;
}

const rb = new Uint8Array(N * N * 4);
function check() {
    gl.readPixels(0, 0, N, N, gl.RGBA, gl.UNSIGNED_BYTE, rb);
    let h = 0x811c9dc5;
    for (let i = 0; i < rb.length; i += 4) { h ^= rb[i] | (rb[i + 1] << 8) | (rb[i + 2] << 16); h = Math.imul(h, 0x01000193); }
    hash = h >>> 0;
    if (ref === null) ref = hash; else if (hash !== ref) bad++;
    checks++;
    status();
}

if (MODE === 'idle') {
    // every=<s>: how often a background page redraws and checks (default 5).
    const tick = () => { draw(); check(); };
    tick(); setInterval(tick, 1000 * +(P.get('every') || 5));
} else {
    const loop = () => {
        stream();
        draw();
        if (done && frames % CHECK === 0) check();
        requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
}
</script></body></html>
